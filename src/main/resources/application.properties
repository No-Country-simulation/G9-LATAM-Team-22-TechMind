spring.application.name=indexmind-api

# puerto de ejecucion del servidor
server.port=8080

# ruta personalizada para OpenAPI (JSON) y Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Serializa y deserealiza los datos de entrada y salida
spring.jackson.property-naming-strategy=SNAKE_CASE

# URL y Timeout
ds.modelo.base-url = http://localhost:8000
ds.modelo.timeout-ms=3000